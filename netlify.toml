# ============================================
# JURISTART — Netlify Configuration
# Déploiement Statique Sécurisé & Redirections SPA
# ============================================

[build]
  publish = "."
  command = "echo 'Juristart deployment ready.'"

# Redirections SPA pour Single Page App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes HTTP de Sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://wupoowrmamfgxkoyegyz.supabase.co wss://wupoowrmamfgxkoyegyz.supabase.co;"
